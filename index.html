<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C2340">
<title>ND Pios Tendency Chart</title>
<meta name="apple-mobile-web-app-title" content="Pios Chart">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  /* Notre Dame Pios — scarlet & navy */
  --scarlet:#C8102E; --navy:#0C2340;
  --bg:#040b16; --panel:rgba(12,35,64,.55); --panel2:rgba(22,49,86,.55); --line:rgba(120,170,255,.16); --line2:rgba(120,170,255,.32);
  --text:#eaf2ff; --muted:#8fb0dc; --dim:#5a7aa6; --accent:#FF1E3C; --accent-ink:#ffffff; --ice:#6ee7ff;
  --green:#1f8f55; --green2:#5dffa8; --red:#8a1020; --red2:#ff6f84; --blue:#8fd6ff;
  --mono:'SF Mono','Menlo','Roboto Mono',monospace;
  --condensed:'Barlow Condensed','Arial Narrow',system-ui,sans-serif; --sans:'Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;overscroll-behavior:none}
body{background:
  radial-gradient(1000px 420px at 10% -10%, rgba(255,30,60,.22), transparent 60%),
  radial-gradient(900px 500px at 95% 110%, rgba(12,60,140,.45), transparent 60%),
  linear-gradient(rgba(120,170,255,.05) 1px, transparent 1px),
  linear-gradient(90deg, rgba(120,170,255,.05) 1px, transparent 1px),
  linear-gradient(180deg,#07182e 0%, var(--bg) 100%);
  background-size:auto,auto,28px 28px,28px 28px,auto; background-attachment:fixed}
body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:30;background:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 2px,transparent 2px 4px);opacity:.22}
@media print{body:before{display:none}}
body{display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
input,select{font-family:inherit}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
a{color:var(--blue)}
.hidden{display:none !important}

/* top bar */
#top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:linear-gradient(90deg,rgba(255,30,60,.14),rgba(5,14,30,.85) 35%,rgba(5,14,30,.85) 65%,rgba(110,231,255,.08));backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,30,60,.6);box-shadow:0 1px 0 rgba(255,30,60,.25),0 8px 30px rgba(0,0,0,.5),0 0 24px rgba(255,30,60,.15);flex-shrink:0;position:relative}
#top:after{content:'';position:absolute;left:0;bottom:-1px;height:1px;width:40%;background:linear-gradient(90deg,var(--accent),transparent);box-shadow:0 0 10px var(--accent)}
#top .brand{font-family:var(--condensed);font-weight:700;font-size:22px;letter-spacing:1px;color:#fff;display:flex;align-items:baseline;gap:6px}
#top .brand .nd{color:#fff;padding:1px 8px;font-size:18px;border:1px solid var(--accent);background:linear-gradient(180deg,rgba(255,30,60,.55),rgba(255,30,60,.2));clip-path:polygon(0 0,100% 0,100% 70%,88% 100%,0 100%);text-shadow:0 0 10px rgba(255,30,60,.9);box-shadow:0 0 14px rgba(255,30,60,.45)}
#top .brand .sub{color:var(--ice);font-size:12px;letter-spacing:3px;font-family:var(--mono);font-weight:500;text-shadow:0 0 8px rgba(110,231,255,.5)}
.sel{height:40px;padding:0 10px;border-radius:4px;border:1px solid var(--line2);background:rgba(10,28,52,.8);color:#fff;font-size:15px;font-weight:600;max-width:200px;box-shadow:inset 0 0 0 1px rgba(110,231,255,.06)}
.nav{display:flex;gap:6px;margin-left:auto}
.score{flex-basis:100%;flex-wrap:wrap;row-gap:4px}
.nav button{height:40px;padding:0 16px;border-radius:3px;border:1px solid var(--line2);background:rgba(10,28,52,.6);color:var(--muted);font-family:var(--condensed);font-weight:700;font-size:16px;letter-spacing:2px;text-transform:uppercase;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.nav button.on{background:linear-gradient(180deg,rgba(255,30,60,.85),rgba(170,10,40,.9));color:#fff;border-color:#ff7a8c;box-shadow:0 0 18px rgba(255,30,60,.6),inset 0 0 12px rgba(255,255,255,.15);text-shadow:0 0 8px rgba(255,255,255,.6)}
.score{display:flex;align-items:center;gap:7px;padding:5px 10px;background:linear-gradient(90deg,rgba(255,30,60,.08),rgba(3,10,22,.9) 20%,rgba(3,10,22,.9) 80%,rgba(110,231,255,.08));border:1px solid var(--line2);border-radius:4px;box-shadow:inset 0 0 20px rgba(0,0,0,.6),0 0 0 1px rgba(110,231,255,.05);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.score .pts{font-family:var(--mono);font-size:22px;color:#fff;text-shadow:0 0 14px rgba(110,231,255,.8)}
.score .nm.opp{color:var(--ice);text-shadow:0 0 8px rgba(110,231,255,.7)} .score .nm.us{color:var(--accent);text-shadow:0 0 8px rgba(255,30,60,.7)}
.score .team{display:flex;align-items:center;gap:5px}
.score .nm{font-family:var(--condensed);font-size:14px;font-weight:700;min-width:34px;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .pts{width:34px;text-align:center;font-family:var(--condensed);font-size:24px;font-weight:700;color:#fff}
.mini{width:28px;height:28px;border-radius:4px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font-size:15px;padding:0}
.tos{display:flex;gap:3px;margin-left:3px}
.tos i{display:block;width:11px;height:11px;border-radius:2px;border:1px solid currentColor}
.tos i.on{background:currentColor}
.tos .gap{width:5px;border:0}
.to-btn{height:28px;padding:0 7px;border-radius:4px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font-size:11px;font-weight:600}
.vsep{width:1px;height:28px;background:var(--line2)}
.clock{display:flex;align-items:center;gap:7px;font-family:var(--condensed);font-size:15px;font-weight:700}
.clock small{color:var(--muted);font-size:11px;font-weight:600}
.clock button{height:28px;min-width:30px;padding:0 6px;border-radius:4px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font-family:var(--condensed);font-size:15px;font-weight:700}
.to-btn.endgame{background:linear-gradient(180deg,rgba(255,30,60,.95),rgba(150,6,34,.98));border-color:#ff8a9a;color:#fff;font-family:var(--condensed);font-size:13px;font-weight:700;letter-spacing:1.5px;padding:0 8px;box-shadow:0 0 14px rgba(255,30,60,.55);text-shadow:0 0 8px rgba(255,255,255,.6);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.btn.act.flag{color:var(--amber);border-color:rgba(255,210,60,.7);text-shadow:0 0 8px rgba(255,210,60,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 10px rgba(255,210,60,.25)}
.btn.act.flag.on{background:linear-gradient(180deg,rgba(255,210,60,.95),rgba(200,150,20,.98));color:#1a1200;border-color:#ffe680;box-shadow:0 0 16px rgba(255,210,60,.6);text-shadow:none}
.snip{display:inline-flex;align-items:center;gap:4px;padding:3px 6px;border-radius:4px}
.wheel.snipw{width:58px;height:32px} .wheel.snipw .wi{height:32px;line-height:32px;font-size:17px;color:var(--amber);text-shadow:0 0 8px rgba(255,210,60,.5)}
#chart .wheel.snipw,#chart .wheel.snipw .wi{height:32px;line-height:32px}
.snipin{width:54px;height:32px;text-align:center;border-radius:4px;border:1px solid var(--line2);background:linear-gradient(180deg,#02070f,#071527);color:var(--amber);font-family:var(--mono);font-size:15px;font-weight:700;padding:0;text-shadow:0 0 8px rgba(255,210,60,.5)}
.final{font-family:var(--condensed);font-weight:700;letter-spacing:3px;color:#ff8a9a;border:1px solid var(--accent);padding:1px 8px;border-radius:3px;box-shadow:0 0 12px rgba(255,30,60,.5)}
.clock button.on{background:rgba(255,30,60,.25);color:#fff;border-color:var(--accent);box-shadow:0 0 12px rgba(255,30,60,.6),inset 0 0 8px rgba(255,30,60,.4)}
.clock span{font-family:var(--mono);color:var(--ice);text-shadow:0 0 8px rgba(110,231,255,.6)}

/* views */
#main{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.view{display:none;flex-direction:column;gap:10px;padding:10px 14px;flex:1 0 auto;min-height:0}
#log.view,#reports.view{flex:1 1 0;min-height:0;overflow:hidden}
.view.on{display:flex}
.panel{background:linear-gradient(135deg,rgba(110,231,255,.06),transparent 40%,transparent 60%,rgba(255,30,60,.06)),var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:6px;padding:12px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.03),inset 0 1px 0 rgba(255,255,255,.08);position:relative}
.panel:before,.panel:after{content:'';position:absolute;width:14px;height:14px;pointer-events:none}
.panel:before{top:-1px;left:-1px;border-top:2px solid var(--accent);border-left:2px solid var(--accent);box-shadow:-2px -2px 10px rgba(255,30,60,.4)}
.panel:after{bottom:-1px;right:-1px;border-bottom:2px solid var(--ice);border-right:2px solid var(--ice);box-shadow:2px 2px 10px rgba(110,231,255,.35)}
.panel>.ph:first-child{padding-left:10px;border-left:2px solid var(--accent);box-shadow:-1px 0 10px rgba(255,30,60,.3)}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ph b{font-family:var(--condensed);font-size:16px;font-weight:700;letter-spacing:3px;color:#fff;text-shadow:0 0 10px rgba(110,231,255,.35)}
.ph small{color:var(--dim);font-size:11px}
.lbl{font-size:10px;text-transform:uppercase;letter-spacing:2.2px;color:var(--muted);font-weight:600;font-family:var(--mono)}
.lbl:before{content:'▸ ';color:var(--accent);opacity:.8}
.lbl em{font-style:normal;color:var(--accent)} .lbl em.rz{color:var(--red2)} .lbl span{color:var(--dim)}
.grp{display:flex;flex-direction:column;gap:4px}
.row{display:flex;flex-wrap:wrap;gap:5px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.btn{height:40px;padding:0 12px;border-radius:4px;border:1px solid var(--line2);background:linear-gradient(180deg,rgba(28,60,104,.7),rgba(10,28,52,.8));color:var(--text);font-family:var(--condensed);font-size:17px;font-weight:700;letter-spacing:.5px;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(110,231,255,.05);transition:transform .05s,box-shadow .15s;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.btn:active{transform:translateY(1px)}
.g3 .btn,.g4 .btn{padding:0 6px;letter-spacing:0;overflow:hidden;text-overflow:ellipsis}
.btn.need{border-color:var(--amber);animation:pulse 1.2s infinite}
.btn.on{background:linear-gradient(180deg,rgba(255,30,60,.9),rgba(160,8,36,.95));color:#fff;border-color:#ff8a9a;box-shadow:0 0 16px rgba(255,30,60,.65),inset 0 0 14px rgba(255,255,255,.18);text-shadow:0 0 8px rgba(255,255,255,.7)}
.btn.ok.on{background:linear-gradient(180deg,rgba(31,143,85,.9),rgba(16,90,52,.95));color:#fff;border-color:#5dffa8;box-shadow:0 0 16px rgba(93,255,168,.45),inset 0 0 14px rgba(255,255,255,.15)}
.btn.add{width:40px;padding:0;border-style:dashed;background:transparent;color:var(--muted);font-size:18px}
.btn.big{height:44px;font-size:19px}
.btn.step{width:40px;padding:0;font-size:20px;font-family:var(--sans);font-weight:500}
.num{height:40px;min-width:0;width:100%;text-align:center;border-radius:4px;border:1px solid var(--line2);background:linear-gradient(180deg,#02070f,#071527);color:var(--ice);font-family:var(--mono);font-size:22px;font-weight:700;padding:0;box-shadow:inset 0 2px 12px rgba(0,0,0,.8),0 0 0 1px rgba(110,231,255,.08);text-shadow:0 0 10px rgba(110,231,255,.6)}
.num.pos{color:var(--green2);border-color:var(--green)} .num.neg{color:var(--red2);border-color:#a33}
.num.need{border-color:var(--amber);color:var(--amber);text-shadow:0 0 10px rgba(255,210,60,.7);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px rgba(255,210,60,.5),0 0 6px rgba(255,210,60,.4)}50%{box-shadow:0 0 0 2px rgba(255,210,60,.9),0 0 22px rgba(255,210,60,.95)}}
.txt{height:40px;padding:0 12px;border-radius:4px;border:1px solid var(--line2);background:rgba(2,7,15,.8);color:#fff;font-size:16px;font-weight:600;width:100%;box-shadow:inset 0 2px 10px rgba(0,0,0,.7)}
.stepper{display:flex;gap:4px;align-items:center}
.chip{padding:4px 10px;border-radius:2px;background:rgba(110,231,255,.08);border:1px solid rgba(110,231,255,.4);font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ice);letter-spacing:1px;box-shadow:0 0 8px rgba(110,231,255,.15)}
.chip.hi{color:#ff8a9a;border-color:rgba(255,30,60,.6);background:rgba(255,30,60,.1);box-shadow:0 0 8px rgba(255,30,60,.25)} .chip.rz{background:rgba(255,30,60,.3);border-color:#ff5a70;color:#fff;box-shadow:0 0 12px rgba(255,30,60,.5)}
.preview{height:40px;display:flex;align-items:center;gap:8px;padding:0 10px;background:rgba(2,7,15,.8);border-radius:4px;border:1px solid rgba(110,231,255,.35);box-shadow:inset 0 0 14px rgba(110,231,255,.08),0 0 10px rgba(110,231,255,.15);font-family:var(--mono);font-size:16px;font-weight:700;color:var(--ice);white-space:nowrap;overflow:hidden;text-shadow:0 0 8px rgba(110,231,255,.6)}
.preview .dot{color:var(--dim)} .preview .nd{color:var(--accent);font-size:14px}

/* field graphic */
.field{position:relative;height:62px;border-radius:3px;overflow:hidden;border:1px solid rgba(110,231,255,.35);background:#03101c;box-shadow:inset 0 0 30px rgba(0,0,0,.8),0 0 16px rgba(110,231,255,.12)}
.field svg{position:absolute;inset:0;width:100%;height:100%}
.field .cap{position:absolute;top:4px;font-family:var(--condensed);font-size:11px;letter-spacing:2px;font-weight:700;color:rgba(255,255,255,.75)}
.field .cap.l{left:8px} .field .cap.r{right:8px}
.field .ball{position:absolute;top:0;bottom:0;width:0;transition:left .25s}
.field .ball:before{content:'';position:absolute;left:-1px;top:0;bottom:0;width:2px;background:var(--ice);box-shadow:0 0 12px var(--ice),0 0 24px rgba(110,231,255,.6)}
.field .ball i{position:absolute;left:-9px;top:50%;margin-top:-6px;width:18px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c8773a,#6b3a1c);border:1px solid #f1d9bf;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.field .fd{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);box-shadow:0 0 12px var(--accent),0 0 24px rgba(255,30,60,.6)}
.field .gain{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(90deg,rgba(255,30,60,.18) 0 4px,rgba(255,30,60,.06) 4px 8px)}
.field .zone{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:2px;color:var(--ice);background:rgba(2,7,15,.75);border:1px solid rgba(110,231,255,.35);padding:1px 10px;border-radius:2px;text-shadow:0 0 8px rgba(110,231,255,.6)}
.field.empty svg{opacity:.55}
.field .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--condensed);font-size:16px;letter-spacing:2px;font-weight:700;color:#ff9aa6;text-shadow:0 1px 4px #000}
/* drive + meter */
.drive{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.drive .card{flex:1;min-width:120px;display:flex;flex-direction:column;align-items:center;padding:7px 8px;border-radius:3px;background:linear-gradient(180deg,rgba(2,7,15,.7),rgba(10,28,52,.6));border:1px solid var(--line2);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);box-shadow:inset 0 0 18px rgba(110,231,255,.05)}
.drive .card b{font-family:var(--mono);font-size:26px;line-height:1;font-weight:700;color:#fff;text-shadow:0 0 12px rgba(110,231,255,.6)}
.drive .card b.sc{color:#ff8a9a;text-shadow:0 0 12px rgba(255,30,60,.8)} .drive .card b.gr{color:var(--green2);text-shadow:0 0 12px rgba(93,255,168,.7)}
.drive .card span{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-top:3px}
.meter{flex:2;min-width:240px;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:6px 12px;border-radius:3px;background:linear-gradient(180deg,rgba(2,7,15,.7),rgba(10,28,52,.6));border:1px solid var(--line2)}
.meter .bar{display:flex;height:14px;border-radius:2px;overflow:hidden;background:#02070f;box-shadow:inset 0 1px 6px rgba(0,0,0,.8),0 0 0 1px rgba(110,231,255,.1)}
.meter .bar i{display:block;height:100%;transition:width .3s}
.meter .bar .run{background:linear-gradient(180deg,#ff5a70,#c8102e);box-shadow:0 0 10px rgba(255,30,60,.6)} .meter .bar .pass{background:linear-gradient(180deg,#8fe6ff,#2aa8d8);box-shadow:0 0 10px rgba(110,231,255,.5)}
.meter .leg{display:flex;justify-content:space-between;font-family:var(--condensed);font-size:13px;font-weight:700;letter-spacing:1px}
.meter .leg{font-family:var(--mono);font-size:12px} .meter .leg span{color:var(--muted)} .meter .leg b{color:#fff} .meter .leg b:first-child{color:#ff8a9a} .meter .leg b:last-child{color:var(--ice)}
/* reports */
#reports.view{padding:6px 10px;gap:6px}
#reports .panel{padding:8px 12px;gap:6px}
.subbody .charts{margin-top:6px}
.subtabs{gap:4px;margin:4px 0 2px;border-top:1px solid var(--line);padding-top:6px}
.subtabs .btn{height:30px;font-size:12.5px;padding:0 10px;letter-spacing:1px;text-transform:uppercase;background:rgba(10,28,52,.5);color:var(--muted)}
.subtabs .btn.on{color:#fff}
.subbody h3,.subbody h4{margin-top:4px}
.rep .kpis{gap:6px;margin:2px 0 4px} .rep .kpi{padding:5px 6px} .rep .kpi b{font-size:20px} .rep .kpi span{font-size:9.5px}
.rep h4{margin:6px 0 3px}
.rep .subhead{margin:10px 0 3px;font-family:var(--condensed);font-size:15px;letter-spacing:1.5px;color:var(--ice);border-left:2px solid var(--ice);padding-left:8px}
.rep .tbl{font-size:12.5px} .rep .tbl th,.rep .tbl td{padding:4px 7px}
/* amber "still needs input" indicator */
:root{--amber:#ffd23c}
.pend{position:relative;border-radius:6px;box-shadow:0 0 0 2px rgba(255,210,60,.75),0 0 14px rgba(255,210,60,.45);background:rgba(255,210,60,.06)}
.grp.pend{padding:2px 3px;margin:-2px -3px}
.pend>.lbl,.pend>.ph>.lbl,.pend>label.lbl{color:var(--amber)} .pend>.lbl:before,.pend>.ph>.lbl:before,.pend>label.lbl:before{color:var(--amber)}
.team.pend,.clock .qtrs.pend{padding:2px 6px;margin:-2px -6px}
/* yard-line swipe wheel */
.wheel{position:relative;height:40px;width:100%;min-width:0;border-radius:4px;border:1px solid var(--line2);background:linear-gradient(180deg,#02070f,#071527);box-shadow:inset 0 2px 12px rgba(0,0,0,.8),0 0 0 1px rgba(110,231,255,.08);overflow:hidden;touch-action:pan-y}
.wheel .wl{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wheel .wl::-webkit-scrollbar{display:none}
.wheel .wi{height:40px;line-height:40px;text-align:center;scroll-snap-align:start;font-family:var(--mono);font-size:22px;font-weight:700;color:var(--ice);text-shadow:0 0 10px rgba(110,231,255,.6);user-select:none}
.wheel:before,.wheel:after{content:'';position:absolute;left:50%;transform:translateX(-50%);border:5px solid transparent;pointer-events:none;opacity:.55}
.wheel:before{top:1px;border-bottom:6px solid var(--muted);border-top:0}
.wheel:after{bottom:1px;border-top:6px solid var(--muted);border-bottom:0}

<body>

<div id="top"></div>
<div id="main">
  <section id="chart" class="view"></section>
  <section id="log" class="view"></section>
  <section id="reports" class="view"></section>
  <section id="opponents" class="view"></section>
  <section id="export" class="view"></section>
</div>
<div id="toast" class="toast"></div>
<div id="modal" class="hidden"></div>

<script>
/* ============================================================
   TENDENCY CHART — offline opponent-offense charting
   Single file. Data lives in localStorage (key below).
   ============================================================ */
const KEY = 'tendency_chart_v1';
const PLAY_TYPES = ['RUN','PASS','RPO','SCREEN'];
const RESULTS = {
  RUN:    ['RUSH','RUSH TD','FUMBLE'],
  PASS:   ['SCRAMBLE','SCRAMBLE TD','COMPLETE','COMPLETE TD','INCOMPLETE','INTERCEPTION','SACK','COMPLETE FUMBLE','SACK FUMBLE'],
  RPO:    ['RUSH','RUSH TD','FUMBLE','COMPLETE','COMPLETE TD','INCOMPLETE','INTERCEPTION','SACK','COMPLETE FUMBLE','SACK FUMBLE','SCRAMBLE','SCRAMBLE TD'],
  SCREEN: ['COMPLETE','COMPLETE TD','INCOMPLETE','INTERCEPTION','SACK','COMPLETE FUMBLE','SACK FUMBLE']
};
const RUN_RESULTS = new Set(['RUSH','RUSH TD','FUMBLE','SCRAMBLE','SCRAMBLE TD']);
const FUMBLE_RESULTS = new Set(['FUMBLE','COMPLETE FUMBLE','SACK FUMBLE']);
const ZERO_YD_RESULTS = new Set(['INCOMPLETE','INTERCEPTION']);
const CATS = [['personnel','Personnel'],['backfield','Backfield'],['form','Form Family'],['motion','Motion']];
// distance buckets (edit here)
function distBucket(d){ if(d<=3) return 'SHORT'; if(d<=7) return 'MED'; if(d<=10) return 'LONG'; return 'XLONG'; }

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pct(a,b){ return b? Math.round(100*a/b)+'%':'—'; }
function avg(arr){ return arr.length? (arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1):'—'; }

function defaultState(){
  const lib = {
    personnel:['10','11','12','13','20','21','22'],
    backfield:['GUN RT','GUN LF','PISTOL','PISTOL RT','PISTOL LF','EMPTY','SPLIT GUN','I','I RT','I LF','POWER I','WILDCAT','T','WING T RT','WING T LF','UNO','UNDER'],
    form:['DOUBLES','TRIPS','TREY','BUNCH','TIGHT','NUB','PRO','ACE','SPREAD','STACK'],
    motion:['NONE','JET','ORBIT','SHORT','ACROSS','RETURN','SHIFT']
  };
  const opp = { id:uid(), name:'OPPONENT 1', us:'ND',
    personnel:['10','11','12','21'], backfield:['GUN RT','GUN LF','PISTOL','EMPTY'], form:['DOUBLES','TRIPS','TREY','BUNCH','TIGHT'], motion:['NONE','JET','ORBIT','SHIFT'],
    roster:[] };
  const game = newGame(opp.id,'Game 1');
  return { lib, opponents:[opp], games:[game], plays:[], ui:{ oppId:opp.id, gameId:game.id } };
}
function newGame(oppId,label){
  return { id:uid(), oppId, label, date:new Date().toISOString().slice(0,10),
    score:{opp:0,us:0}, to:{opp:[3,3],us:[3,3]}, qtr:1, series:1,
    sit:{ hash:null, down:1, dist:10, side:'OWN', yl:null, needYL:true }, snipNext:1 };
}
/* Backfield TYPE — automated from the charted backfield. dc = what the ND defensive staff calls it. */
const BF_TYPE = {
  'GUN RT':{type:'GUN'}, 'GUN LF':{type:'GUN'},
  'PISTOL':{type:'PISTOL'},
  'EMPTY':{type:'EMPTY'},
  'PISTOL RT':{type:'GUN OFFSET', dc:'GUN RAM'}, 'PISTOL LF':{type:'GUN OFFSET', dc:'GUN LION'},
  'SPLIT GUN':{type:'GUN 2'},
  'I':{type:'I STACK'}, 'I-FORM':{type:'I STACK'},
  'I RT':{type:'I OFFSET'}, 'I LF':{type:'I OFFSET'},
  'POWER I':{type:'POWER I'},
  'WILDCAT':{type:'WILDCAT'},
  'T':{type:'T'},
  'WING T RT':{type:'WING T'}, 'WING T LF':{type:'WING T'},
  'UNO':{type:'UNO'}
};
function bfType(bf){ if(!bf) return null; const t=BF_TYPE[bf.toUpperCase()]; return t? t.type : bf.toUpperCase(); }
function bfDC(bf){ if(!bf) return null; const t=BF_TYPE[bf.toUpperCase()]; return t&&t.dc? t.dc : null; }
function load(){
  try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.lib&&s.opponents){
    const master=defaultState().lib.backfield; master.forEach(b=>{ if(!s.lib.backfield.includes(b)) s.lib.backfield.push(b); });
    // re-derive every stored play so new auto-tags (backfield type, DC terms) apply to old data
    (s.plays||[]).forEach(p=>{ try{ p.d=derive(p); }catch(e){} });
    try{ s.opponents.forEach(o=>{ if(!o.concepts) rebuildConcepts(o, s); }); }catch(e){ console.error(e); }
    return s; } }catch(e){}
  return defaultState();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Storage full or blocked — export a backup!'); } }

let S = load();
let view = 'chart';
let editId = null;      // play id being edited
let stash = null;       // live entry stashed while editing
let penOpen = false;
let logFilter = { gameId:'current', q:'' };
let repScope = 'game';  // 'game' | 'opp' | 'all'
let cur = blankEntry();

function blankEntry(){
  return { hash:null, down:1, dist:10, side:'OWN', yl:null, pers:null, bf:null, str:null, form:null, motion:null,
    type:null, dir:null, result:null, fumRec:false, concept:'', players:[], yds:0, pat2:false, ydsTouched:false, penQ:null, scrType:null, scrDir:null };
}
function game(){ return S.games.find(g=>g.id===S.ui.gameId); }
function opp(){ return S.opponents.find(o=>o.id===S.ui.oppId); }
function gamePlays(g){ return S.plays.filter(p=>p.gameId===(g||game()).id).sort((a,b)=>a.n-b.n); }

/* ---------- field math ---------- */
function fmtSpot(side,yl){ if(yl==null) return '—'; return (side==='OWN'?'−':'+')+yl; }
function toGoal(side,yl){ if(yl==null) return null; return side==='OPP'? +yl : 100-(+yl); }
function fromGoal(tg){ tg=Math.max(1,Math.min(99,Math.round(tg))); return tg<=50? {side:'OPP',yl:tg} : {side:'OWN',yl:100-tg}; }
function fieldZone(tg){ if(tg==null) return null; if(tg<=5) return 'GOAL LINE'; if(tg<=20) return 'RED ZONE'; if(tg<=40) return 'FRINGE'; if(tg>=90) return 'BACKED UP'; return 'OPEN FIELD'; }
function ddLabel(e){ if(!e.down) return ''; const tg=toGoal(e.side,e.yl); const goal = tg!=null && e.dist>=tg; return `${e.down}${['st','nd','rd','th'][e.down-1]} & ${goal?'GOAL':e.dist}`; }
function ddBucket(e){ const tg=toGoal(e.side,e.yl); if(tg!=null && e.dist>=tg) return `${e.down}&GOAL`; if(e.down===1&&e.dist===10) return '1&10'; return `${e.down}&${distBucket(e.dist)}`; }

function isRunResult(e){ if(e.type==='RUN') return true; if(e.type==='PASS'||e.type==='SCREEN') return RUN_RESULTS.has(e.result)&&e.result!=='SCRAMBLE'&&e.result!=='SCRAMBLE TD' ? true : false; if(e.type==='RPO') return RUN_RESULTS.has(e.result); return false; }
function runPass(e){ // charted as run or pass for tendency purposes
  if(e.type==='RUN') return 'RUN';
  if(e.type==='RPO') return e.result? (RUN_RESULTS.has(e.result)&&!/SCRAMBLE/.test(e.result)?'RUN':'PASS') : 'RPO';
  return 'PASS';
}

/* ---------- derived tags ---------- */
function derive(e){
  const d = {};
  d.bfType = bfType(e.bf); d.bfDC = bfDC(e.bf);
  const L=e.str==='LEFT', R=e.str==='RIGHT';
  if(e.dir==='LEFT'||e.dir==='RIGHT'){
    if(L||R) d.sw = ((e.dir==='RIGHT')===R) ? 'STRONG':'WEAK';
    if(e.hash==='L') d.fb = e.dir==='RIGHT'?'FIELD':'BOUNDARY';
    if(e.hash==='R') d.fb = e.dir==='LEFT'?'FIELD':'BOUNDARY';
  }
  const gunSide = /\s(RT|LF)$/.test(e.bf||'') ? (e.bf.endsWith('RT')?'RIGHT':'LEFT') : null;
  d.bfLabel = e.bf;
  if(gunSide){
    const base = e.bf.replace(/\s(RT|LF)$/,'');
    if(L||R) d.bfLabel = base+' '+((gunSide==='RIGHT')===R ? 'STRONG':'WEAK');
    if(e.hash==='L') d.backTo = gunSide==='RIGHT'?'FIELD':'BOUNDARY';
    if(e.hash==='R') d.backTo = gunSide==='LEFT'?'FIELD':'BOUNDARY';
    if(e.dir==='LEFT'||e.dir==='RIGHT') d.toBack = (e.dir===gunSide)?'TO BACK':'AWAY FROM BACK';
  }
  const tg = toGoal(e.side,e.yl);
  if(/^SCRAMBLE/.test(e.result||'') && e.scrDir){
    d.scr = { type:e.scrType||'', dir:e.scrDir,
      fb: e.hash==='L'?(e.scrDir==='RIGHT'?'FIELD':e.scrDir==='LEFT'?'BOUNDARY':'MIDDLE') : e.hash==='R'?(e.scrDir==='LEFT'?'FIELD':e.scrDir==='RIGHT'?'BOUNDARY':'MIDDLE') : (e.scrDir==='MIDDLE'?'MIDDLE':'MOF '+e.scrDir),
      sw: (L||R)&&e.scrDir!=='MIDDLE' ? (((e.scrDir==='RIGHT')===R)?'STRONG':'WEAK') : (e.scrDir==='MIDDLE'?'MIDDLE':'BAL'),
      toPlay: e.dir ? (e.scrDir===e.dir?'TOWARD PLAY':(e.scrDir==='MIDDLE'||e.dir==='MIDDLE')?'MIDDLE':'AWAY FROM PLAY') : '' };
  }
  d.tg = tg; d.zone = fieldZone(tg);
  d.dd = e.down? ddBucket(e) : null;
  d.rp = e.type? runPass(e) : null;
  d.formation = (d.bfLabel||'?')+' · '+(e.form||'?');
  return d;
}
function tagChips(e){
  const d=derive(e); const out=[];
  if(e.dir) out.push([e.dir,'']);
  if(d.sw) out.push([d.sw,'']);
  if(d.fb) out.push([d.fb,'']);
  if(d.bfLabel&&d.bfLabel!==e.bf) out.push([d.bfLabel,'hi']);
  if(d.bfType&&d.bfType!==(e.bf||'').toUpperCase()) out.push([d.bfType,'']);
  if(d.bfDC) out.push([d.bfDC,'hi']);
  if(d.scr){ out.push([`SCR ${d.scr.type} ${d.scr.dir}`,'hi']); if(d.scr.fb&&d.scr.fb!=='MIDDLE') out.push([`SCR ${d.scr.fb}`,'']); if(d.scr.sw&&d.scr.sw!=='MIDDLE'&&d.scr.sw!=='BAL') out.push([`SCR ${d.scr.sw}`,'']); if(d.scr.toPlay&&d.scr.toPlay!=='MIDDLE') out.push([`SCR ${d.scr.toPlay}`,'']); }
  if(d.backTo) out.push(['BACK TO '+d.backTo,'hi']);
  if(d.toBack) out.push([d.toBack,'']);
  if(d.zone==='RED ZONE'||d.zone==='GOAL LINE') out.push([d.zone,'rz']); else if(d.zone) out.push([d.zone,'']);
  if(d.dd) out.push([d.dd.replace('&',' & '),'']);
  if(d.rp==='RPO') out.push(['RPO · pick result','']);
  return out;
}

/* ---------- next-play automation ---------- */
function computeNext(e){
  if(!e.down || e.yl==null) return {ok:false, msg:'set ball on'};
  const tg = toGoal(e.side,e.yl);
  const yds = ZERO_YD_RESULTS.has(e.result)? 0 : (+e.yds||0);
  const r = e.result||'';
  if(/TD$/.test(r) || (r && tg-yds<=0 && !/INCOMPLETE|INTERCEPTION/.test(r))) return {ok:true,newDrive:'TOUCHDOWN'};
  if(r==='INTERCEPTION' || (FUMBLE_RESULTS.has(r)&&!e.fumRec)) return {ok:true,newDrive:'TURNOVER'};
  const goal = e.dist>=tg;
  const need = goal? tg : e.dist;
  const newTg = tg - yds;
  if(newTg>=100) return {ok:true,newDrive:'SAFETY'};
  let nx;
  if(yds>=need){ const pos=fromGoal(newTg); nx={ok:true, down:1, dist:Math.min(10,newTg), ...pos, first:true}; }
  else if(e.down>=4) return {ok:true,newDrive:'DOWNS'};
  else { const pos=fromGoal(newTg); nx={ok:true, down:e.down+1, dist:Math.min(e.dist-yds, newTg), ...pos}; }
  if(e.penQ){ const r=penMath(nx, e.penQ); nx={ok:true, down:r.down, dist:r.dist, side:r.side, yl:r.yl, first:nx.first||r.first, pen:penLabel(e.penQ)}; }
  return nx;
}

function fieldStrip(tg,dist,side,yl){
  // opponent drives left -> right toward OUR goal (right). x% = 100 - yards-to-goal
  const ticks=[]; for(let y=10;y<=90;y+=10){ const x=y; const n=y<=50?y:100-y; ticks.push(`<line x1="${x}" y1="0" x2="${x}" y2="100" stroke="rgba(110,231,255,.45)" stroke-width=".4"/><text x="${x}" y="58" font-size="9" fill="rgba(110,231,255,.75)" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700">${n}</text>`); }
  for(let y=5;y<100;y+=5){ if(y%10) ticks.push(`<line x1="${y}" y1="0" x2="${y}" y2="100" stroke="rgba(255,255,255,.14)" stroke-width=".3"/>`); }
  const hashes=[]; for(let y=1;y<100;y++){ hashes.push(`<line x1="${y}" y1="34" x2="${y}" y2="40" stroke="rgba(255,255,255,.28)" stroke-width=".25"/><line x1="${y}" y1="60" x2="${y}" y2="66" stroke="rgba(255,255,255,.28)" stroke-width=".25"/>`); }
  const svg=`<svg viewBox="0 0 100 100" preserveAspectRatio="none">
    <rect x="0" y="0" width="100" height="100" fill="#061a2c"/>
    ${[0,20,40,60,80].map(x=>`<rect x="${x}" y="0" width="10" height="100" fill="rgba(110,231,255,.04)"/>`).join('')}
    <rect x="80" y="0" width="20" height="100" fill="rgba(255,30,60,.22)"/>
    <rect x="95" y="0" width="5" height="100" fill="rgba(255,30,60,.4)"/>
    <line x1="50" y1="0" x2="50" y2="100" stroke="rgba(110,231,255,.7)" stroke-width=".6"/>
    ${hashes.join('')}${ticks.join('')}
    <line x1="80" y1="0" x2="80" y2="100" stroke="rgba(255,120,140,.8)" stroke-width=".6" stroke-dasharray="2 1.5"/>
  </svg>`;
  if(tg==null) return `<div class="field empty">${svg}<span class="cap l">OPP GOAL</span><span class="cap r">ND GOAL</span><div class="hint" style="color:var(--amber);text-shadow:0 0 8px rgba(255,210,60,.6)">ENTER BALL ON TO PLOT THE DRIVE</div></div>`;
  const bx=Math.max(0,Math.min(100,100-tg)); const fdTg=Math.max(0,tg-(+dist||0)); const fx=100-fdTg;
  const zone=fieldZone(tg);
  return `<div class="field">${svg}
    <div class="gain" style="left:${bx}%;width:${Math.max(0,fx-bx)}%"></div>
    ${fdTg>0?`<div class="fd" style="left:${fx}%"></div>`:''}
    <div class="ball" style="left:${bx}%"><i></i></div>
    <span class="cap l">OPP GOAL</span><span class="cap r">ND GOAL</span>
    <span class="zone">${zone} · ${tg} TO GO · ${fmtSpot(side,yl)}</span></div>`;
}
function driveStats(g){
  const ps=gamePlays(g).filter(p=>p.series===g.series);
  const yds=ps.reduce((a,p)=>a+(+p.yds||0),0);
  const firsts=ps.filter(p=>{ const d=p.d||derive(p); const need=d.tg!=null&&p.dist>=d.tg?d.tg:p.dist; return (+p.yds||0)>=need || /TD$/.test(p.result||''); }).length;
  const runs=ps.filter(p=>p.d&&p.d.rp==='RUN').length;
  return {n:ps.length,yds,firsts,runs,pass:ps.length-runs};
}

        ${/^SCRAMBLE/.test(cur.result||'')?`<div class="row${(!cur.scrType||!cur.scrDir)?' pend':''}" style="margin-top:4px;align-items:center;gap:6px;flex-wrap:wrap"><span class="lbl">Scramble</span>
          <button class="btn ${cur.scrType==='CLIMB'?'on':''}" style="height:30px;font-size:13px" data-act="set" data-f="scrType" data-v="CLIMB" title="Stepped up / climbed the pocket">CLIMB</button><button class="btn ${cur.scrType==='ESCAPE'?'on':''}" style="height:30px;font-size:13px" data-act="set" data-f="scrType" data-v="ESCAPE" title="Escaped the pocket">ESCAPE</button>
          <span class="lbl" style="margin-left:6px">Went</span>${['LEFT','MIDDLE','RIGHT'].map(d=>`<button class="btn ${cur.scrDir===d?'on':''}" style="height:30px;font-size:13px" data-act="set" data-f="scrDir" data-v="${d}">${d==='MIDDLE'?'MID':d}</button>`).join('')}

        ${FUMBLE_RESULTS.has(cur.result)?`<div class="row" style="margin-top:4px"><button class="btn ${!cur.fumRec?'on':''}" data-act="set" data-f="fumRec" data-v="0">FUMBLE LOST → new drive</button><button class="btn ${cur.fumRec?'on':''}" data-act="set" data-f="fumRec" data-v="1">OFFENSE RECOVERED</button></div>`:''}

          <div class="row">${cur.type?conceptsFor(o,cur.type).slice(0,14).map(c=>`<button class="btn ${cur.concept.toUpperCase()===c.toUpperCase()?'on':''}" style="font-size:12.5px;padding:0 7px;height:30px" data-act="concept" data-v="${esc(c)}">${esc(c)}</button>`).join('')+`<button class="btn add" style="height:30px;width:34px" data-act="conceptAdd" title="New concept">+</button>`+(cur.concept&&!conceptsFor(o,cur.type).some(c=>c.toUpperCase()===cur.concept.toUpperCase())?`<button class="btn on" style="font-size:12.5px;padding:0 7px;height:30px" data-act="concept" data-v="${esc(cur.concept)}">${esc(cur.concept)}</button>`:''):''}</div></div>
        <div class="grp${pend('player')}"><div class="ph"><span class="lbl">Key Player</span><small>tap again to clear</small></div><div class="row">${roster.length?roster.map(p=>`<button class="btn ${cur.players.includes(p.num)?'on':''}" style="font-size:13px;padding:0 8px" data-act="player" data-v="${esc(p.num)}">#${esc(p.num)} ${esc(p.pos||'')}</button>`).join(''):`<span class="note">No roster yet — add skill players under Opponents.</span>`}</div></div>
      </div>

  <div class="panel slim" style="flex-direction:row;align-items:center;gap:10px;flex-wrap:nowrap">

function conceptList(){ const s=new Set(); S.plays.forEach(p=>p.concept&&s.add(p.concept.trim())); return [...s].sort(); }
/* Concepts live per opponent in two buckets, RUN and PASS. SCREEN uses PASS; RPO shows RUN then PASS. */
function cBucket(type){ return type==='RUN'?'RUN':(type==='PASS'||type==='SCREEN')?'PASS':null; }
function oppConcepts(o){ if(!o.concepts) o.concepts={RUN:[],PASS:[]}; if(!o.concepts.RUN) o.concepts.RUN=[]; if(!o.concepts.PASS) o.concepts.PASS=[]; return o.concepts; }
function addConcept(o, bucket, name){ name=(name||'').trim(); if(!o||!name) return; const c=oppConcepts(o); const key=name.toUpperCase(); const B=bucket?[bucket]:['RUN','PASS'];
  B.forEach(b=>{ if(!c[b].some(x=>x.toUpperCase()===key)) c[b].push(name); }); }
function conceptsFor(o, type){ const c=oppConcepts(o); const usage={}; S.plays.filter(p=>p.oppId===o.id&&p.concept).forEach(p=>{ usage[p.concept.toUpperCase()]=(usage[p.concept.toUpperCase()]||0)+1; });
  const sortU=arr=>arr.slice().sort((a,b)=>(usage[b.toUpperCase()]||0)-(usage[a.toUpperCase()]||0));
  if(type==='RUN') return sortU(c.RUN); if(type==='PASS'||type==='SCREEN') return sortU(c.PASS); if(type==='RPO'){ const seen=new Set(); return [...sortU(c.RUN),...sortU(c.PASS)].filter(x=>{ const k=x.toUpperCase(); if(seen.has(k)) return false; seen.add(k); return true; }); } return []; }
function rebuildConcepts(o, st){ st=st||S; oppConcepts(o); (st.plays||[]).filter(p=>p.oppId===o.id&&p.concept).forEach(p=>{ const d=p.d||derive(p); addConcept(o, d.rp==='RUN'?'RUN':d.rp==='PASS'?'PASS':null, p.concept); }); }
function playSummary(p){
  const d=p.d||derive(p);
  return [ddLabel(p), p.hash||'', p.pers||'', d.bfLabel||'', p.form||'', p.motion&&p.motion!=='NONE'?p.motion:'', p.type||'', p.dir?p.dir[0]:'', d.sw?d.sw.slice(0,3):'', d.fb?d.fb.slice(0,3):'', p.concept||'', p.players.map(x=>'#'+x).join(' '), p.result||'', (p.yds>0?'+':'')+p.yds].filter(Boolean).join(' · ');
}

/* ---------- actions ---------- */
let pen = {on:'DEF',yds:5,dn:'REPLAY',ball:'LIVE'};
document.addEventListener('click', async e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  const g=game();
  switch(a){
    case 'view': view=b.dataset.v; penOpen=false; render(); break;
    case 'set': {
      const f=b.dataset.f; let v=b.dataset.v;
      if(f==='down') v=+v; if(f==='fumRec') v=v==='1';
      if(f==='type'){ if(cur.type!==v) cur.result=null; cur.type=v; }
      else if(['bf','form','pers','motion','str','dir','result','hash'].includes(f) && cur[f]===v && f!=='hash') cur[f]=null; // toggle off
      else cur[f]=v;
      if(f==='result' && ZERO_YD_RESULTS.has(v)) cur.yds=0;
      if(f==='result' && /TD$/.test(v||'')){ const tg=toGoal(cur.side,cur.yl); if(tg!=null) cur.yds=tg; }
      if(f==='result' && FUMBLE_RESULTS.has(v)) cur.fumRec=false;
      if(f==='type' && v==='RUN' && !cur.result) cur.result='RUSH';
      if(f==='scrType' && v==='CLIMB' && !cur.scrDir) cur.scrDir='MIDDLE';
      if(f==='result' && !/^SCRAMBLE/.test(v||'')){ cur.scrType=null; cur.scrDir=null; }
      renderChart(); break; }
    case 'stepDist': cur.dist=Math.max(1,Math.min(99,(+cur.dist||0)+(+b.dataset.d))); renderChart(); break;
    case 'stepYds': if(!ZERO_YD_RESULTS.has(cur.result)){ cur.yds=Math.max(-50,Math.min(99,(+cur.yds||0)+(+b.dataset.d))); cur.ydsTouched=true; renderChart(); } break;
    case 'concept': { const v=b.dataset.v; cur.concept = cur.concept.toUpperCase()===v.toUpperCase()? '' : v; renderChart(); break; }
    case 'conceptAdd': { const v=await askText('New '+(cur.type==='RPO'?'RPO':cBucket(cur.type)||'')+' concept:'); if(!v||!v.trim()) return; const o=opp(); addConcept(o, cur.type==='RPO'?null:cBucket(cur.type), v.trim()); cur.concept=v.trim(); save(); renderChart(); break; }
    case 'player': { const v=b.dataset.v; const i=cur.players.indexOf(v); if(i>=0) cur.players.splice(i,1); else cur.players.push(v); renderChart(); break; }
    case 'save': savePlay(); break;
    case 'clear': { const keep={hash:cur.hash,down:cur.down,dist:cur.dist,side:cur.side,yl:cur.yl}; cur=Object.assign(blankEntry(),keep); renderChart(); break; }
    case 'newSeries': startNewDrive('MANUAL'); break;
    case 'undoLast': { const last=gamePlays(g).slice(-1)[0]; if(last&&await askConfirm(`Delete play #${last.n}? The situation will reset to that play's start.`)){ S.plays=S.plays.filter(p=>p.id!==last.id); cur=Object.assign(blankEntry(),{hash:last.hash,down:last.down,dist:last.dist,side:last.side,yl:last.yl}); g.series=last.series; if(last.snip) g.snipNext=last.snip; save(); render(); } break; }
    case 'editPlay': beginEdit(b.dataset.id); break;
    case 'cancelEdit': editId=null; cur=stash||blankEntry(); stash=null; render(); break;
    case 'deletePlay': if(await askConfirm('Delete this play?')){ S.plays=S.plays.filter(p=>p.id!==b.dataset.id); renumber(g); save(); render(); } break;
    case 'penToggle': penOpen=!penOpen; renderChart(); break;
    case 'penUnqueue': cur.penQ=null; renderChart(); break;
    case 'penSet': pen[b.dataset.k]= b.dataset.k==='yds'? (b.dataset.v==='HALF'?'HALF':+b.dataset.v) : b.dataset.v; if(b.dataset.k==='ball') pen.dn = b.dataset.v==='DEAD'?'KEEP':'REPLAY'; renderChart(); break;
    case 'penApply': applyPenalty(); break;
    case 'score': g.score[b.dataset.team]=Math.max(0,g.score[b.dataset.team]+(+b.dataset.d)); if(b.dataset.team==='us') g.ackScore=true; save(); renderTop(); break;
    case 'ackScore': g.ackScore=true; save(); renderTop(); break;
    case 'ackQtr': g.ackQtr=true; save(); renderTop(); break;
    case 'snipStep': g.snipNext=Math.max(1,Math.min(180,(+g.snipNext||1)+(+b.dataset.d))); g.ackSnip=true; save(); renderChart(); break;
    case 'to': { const half=g.qtr>=3?1:0; const t=g.to[b.dataset.team]; if(t[half]>0) t[half]--; else if(await askConfirm('No timeouts left this half. Reset to 3?')) t[half]=3; save(); renderTop(); break; }
    case 'qtr': g.qtr=+b.dataset.q; g.ackQtr=true; save(); renderTop(); break;
    case 'addToBoard': openAddToBoard(b.dataset.cat); break;
    case 'closeModal': closeModal(); break;
    case 'toggleBoardItem': { const o=opp(); const cat=b.dataset.cat, v=b.dataset.v; const i=o[cat].indexOf(v); if(i>=0) o[cat].splice(i,1); else o[cat].push(v); save(); openAddToBoard(cat); renderChart(); break; }
    case 'libAddInline': { const cat=b.dataset.cat; const inp=document.getElementById('libNew'); const v=(inp.value||'').trim().toUpperCase(); if(!v) return; if(!S.lib[cat].includes(v)) S.lib[cat].push(v); const o=opp(); if(!o[cat].includes(v)) o[cat].push(v); save(); openAddToBoard(cat); renderChart(); break; }
    /* log */
    case 'logFilter': logFilter.gameId=b.dataset.v; renderLog(); break;
    /* reports */
    case 'repScope': repScope=b.dataset.v; renderReports(); break;
    case 'repTab': repTab=b.dataset.v; renderReports(); break;
    case 'repSub': repSub[b.dataset.k]=b.dataset.t; renderReports(); break;
    case 'goRep': repTab=b.dataset.tab; if(b.dataset.sub) repSub[repTab]=b.dataset.sub; renderReports(); break;
    case 'rpFilter': rpFilter=b.dataset.v; renderReports(); break;
    case 'downPick': { const v=b.dataset.v==='ALL'?null:+b.dataset.v;
      if(v==null) downFilter=null;
      else if(b.dataset.one==='1') downFilter=[v];                                     // table row drill-in: focus that one down
      else { const set=new Set(downFilter||[]); if(set.has(v)) set.delete(v); else set.add(v); downFilter=set.size?[...set].sort():null; }  // header buttons toggle, combine any downs
      renderReports(); break; }
    case 'print': try{ window.print(); }catch(e){ toast('Print is blocked here — use SAVE PDF'); } break;
    case 'pdf': savePDF(); break;
    /* opponents */
    case 'loadSample': if(S.opponents.some(x=>x.name==='SAMPLE OPPONENT')){ toast('Sample already loaded — delete it first to reload'); break; } loadSample(); break;
    case 'newOpp': { const name=await askText('Opponent name:'); if(!name) return; const o={id:uid(),name:name.trim().toUpperCase(),us:(opp()&&opp().us)||'US',personnel:[...S.lib.personnel],backfield:[...S.lib.backfield],form:[...S.lib.form],motion:[...S.lib.motion],roster:[]}; S.opponents.push(o); const gm=newGame(o.id,'Game 1'); S.games.push(gm); S.ui.oppId=o.id; S.ui.gameId=gm.id; cur=blankEntry(); save(); render(); break; }
    case 'selOpp': selectOpp(b.dataset.id); view='opponents'; render(); break;
    case 'renameOpp': { const o=S.opponents.find(x=>x.id===b.dataset.id); const n=await askText('Opponent name:',o.name); if(n){ o.name=n.trim().toUpperCase(); save(); render(); } break; }
    case 'renameUs': { const o=opp(); const n=await askText('Your team label (shown in score bar):',o.us||'US'); if(n){ o.us=n.trim().toUpperCase().slice(0,8); save(); render(); } break; }
    case 'deleteOpp': { const o=S.opponents.find(x=>x.id===b.dataset.id); if(await askConfirm(`Delete ${o.name} and ALL its games and plays? This cannot be undone.`)){ S.opponents=S.opponents.filter(x=>x.id!==o.id); S.games=S.games.filter(x=>x.oppId!==o.id); S.plays=S.plays.filter(x=>x.oppId!==o.id); if(S.ui.oppId===o.id){ if(S.opponents[0]) selectOpp(S.opponents[0].id); else { S.ui.oppId=null; S.ui.gameId=null; } } save(); render(); } break; }

function savePlay(){
  const g=game(), o=opp();

  if(!cur.hash){ toast('Pick a hash (Left / Middle / Right)'); document.querySelectorAll('[data-f=hash]').forEach(b=>b.classList.add('need')); return; }
  if(!cur.type){ toast('Pick a play type'); return; }
  if(!cur.result){ toast('Pick a result'); return; }
  if(/^SCRAMBLE/.test(cur.result) && (!cur.scrType||!cur.scrDir)){ toast('Scramble: pick CLIMB / ESCAPE and which way he went'); return; }
  if(cur.yl==null){ toast('Enter the yard line (Ball on)'); document.getElementById('yl').focus(); return; }
  if(cur.type==='RPO' && !cur.result){ toast('Pick a result'); return; }
  const rec = Object.assign({}, cur, { yds: ZERO_YD_RESULTS.has(cur.result)?0:(+cur.yds||0), players:[...cur.players], concept:(cur.concept||'').trim() });
  rec.d = derive(rec);
  if(rec.concept){ const b=rec.d.rp==='RUN'?'RUN':rec.d.rp==='PASS'?'PASS':null; addConcept(opp(), b, rec.concept); }
  if(editId){
    const p=S.plays.find(x=>x.id===editId);
    Object.assign(p, rec, {id:p.id, gameId:p.gameId, oppId:p.oppId, n:p.n, series:p.series, qtr:p.qtr, ts:p.ts, snip:p.snip});
    editId=null; cur=stash||blankEntry(); stash=null; save(); toast('Play #'+p.n+' updated'); render(); return;
  }
  const nx=computeNext(cur);
  rec.id=uid(); rec.gameId=g.id; rec.oppId=o.id; rec.n=gamePlays(g).length+1; rec.series=g.series; rec.qtr=g.qtr; rec.ts=Date.now();
  rec.snip=g.snipNext||1; g.snipNext=Math.min(180,rec.snip+1);
  S.plays.push(rec); g.ackQtr=true; g.ackScore=true; g.ackSnip=true;
  if(cur.pat2){ // 2-pt attempt just charted
    rec.pat='2PT'; const good=/TD$/.test(rec.result)||(rec.yds>=toGoal(rec.side,rec.yl)&&!/INCOMPLETE|INTERCEPTION|SACK|FUMBLE/.test(rec.result));
    rec.patGood=good; if(good) g.score.opp+=2; toast(good?'2-pt GOOD · +2':'2-pt NO GOOD'); startNewDrive('KICKOFF', true); return; }
  if(cur.penQ){ rec.penAfter=penLabel(cur.penQ); if(nx.newDrive) toast('Drive ended — dead-ball penalty will be enforced on the kickoff, not charted'); }
  if(nx.newDrive==='TOUCHDOWN'){ rec.td=true; g.score.opp+=6; save(); renderTop(); patPrompt(rec); return; }
  if(nx.newDrive==='SAFETY'){ g.score.us+=2; }
  if(nx.newDrive){ startNewDrive(nx.newDrive, true); return; }
  cur=Object.assign(blankEntry(),{hash:null,down:nx.down,dist:nx.dist,side:nx.side,yl:nx.yl});
  storeSit(); save(); toast(`Saved #${rec.n} → ${ddLabel(cur)} at ${fmtSpot(cur.side,cur.yl)}`); render();
}

/* Penalty math on a situation {down,dist,side,yl}. yds may be 5/10/15 or 'HALF' (half the distance to the goal). Returns new situation + first flag. */
function penMath(sit, pn){
  const tg=toGoal(sit.side,sit.yl); let newTg;
  if(pn.yds==='HALF'){ newTg = pn.on==='DEF'? Math.max(1,Math.ceil(tg/2)) : Math.min(99, tg+Math.ceil((100-tg)/2)); }
  else { newTg = pn.on==='DEF'? Math.max(1,tg-pn.yds) : Math.min(99,tg+pn.yds);
    if(pn.on==='DEF' && tg<=2*pn.yds) newTg=Math.max(1,Math.ceil(tg/2));          // inside double the yardage → half the distance
    if(pn.on==='OFF' && tg>=100-2*pn.yds) newTg=Math.min(99,tg+Math.ceil((100-tg)/2)); }
  const moved=tg-newTg; const pos=fromGoal(newTg); const out={side:pos.side, yl:pos.yl, down:sit.down, dist:sit.dist, first:false};
  if(pn.dn==='AUTO1'){ out.down=1; out.dist=Math.min(10,newTg); out.first=true; }
  else if(pn.dn==='LOSS'){ out.down=Math.min(4,sit.down+1); out.dist=sit.dist-moved; }
  else { out.dist=sit.dist-moved; if(pn.on==='DEF' && out.dist<=0){ out.down=1; out.dist=Math.min(10,newTg); out.first=true; } }   // yards assessed reach the line to gain → 1st down
  out.dist=Math.max(1,Math.min(out.dist,newTg));
  return out;
}
function penLabel(pn){ return `${pn.ball==='DEAD'?'DEAD':'LIVE'} ${pn.on} ${pn.yds==='HALF'?'½ DIST':pn.yds}${pn.dn==='AUTO1'?' AUTO1':pn.dn==='LOSS'?' LOSS':''}`; }
function applyPenalty(){
  if(cur.yl==null){ toast('Set ball on first'); return; }
  if(pen.ball==='DEAD' && cur.type){
    // play is on the board: queue the penalty onto the END of this play — Next Play Auto shows the combined result
    cur.penQ={on:pen.on,yds:pen.yds,dn:pen.dn,ball:'DEAD'}; penOpen=false; toast('Dead-ball penalty queued — applied after this play when you save'); renderChart(); return;
  }
  const r=penMath(cur, pen);
  cur.down=r.down; cur.dist=r.dist; cur.side=r.side; cur.yl=r.yl;
  const last=gamePlays(game()).slice(-1)[0]; if(last && pen.ball==='DEAD'){ last.penAfter=penLabel(pen); }
  penOpen=false; storeSit(); save(); toast(`${pen.ball==='DEAD'?'Dead-ball':'Live-ball'} penalty applied → ${ddLabel(cur)} at ${fmtSpot(cur.side,cur.yl)}${r.first?' · 1ST DOWN':''}`); renderChart();
}

function scopePlays(){
  if(repScope==='game') return gamePlays(game());

function groupBy(ps,fn){ const m=new Map(); ps.forEach(p=>{ const k=fn(p); if(k==null||k==='') return; if(!m.has(k)) m.set(k,[]); m.get(k).push(p); }); return [...m.entries()].sort((a,b)=>b[1].length-a[1].length); }
function rp(ps){ const r=ps.filter(p=>p.d.rp==='RUN').length, pa=ps.filter(p=>p.d.rp==='PASS').length; return {r,pa}; }
function succ(p){ // success rate: 1st 50%, 2nd 70%, 3rd/4th 100%
  const need = p.d.tg!=null && p.dist>=p.d.tg ? p.d.tg : p.dist; const y=+p.yds||0;
  if(/TD$/.test(p.result)) return true; if(p.down===1) return y>=need*0.5; if(p.down===2) return y>=need*0.7; return y>=need;
}
function tendTable(rows, opts={}){
  // rows: [label, plays]
  const total = rows.reduce((a,[,ps])=>a+ps.length,0);
  const chart = opts.noChart||!rows.length ? '' : `<div class="chart tchart">${opts.conceptColor? conceptSVG(rows, opts.conceptColor, true, 10) : miniSVG(miniRows(rows, Math.min(rows.length,10)), true, opts.noRP)}</div>`;
  return chart+`<table class="tbl"><thead><tr><th>${opts.label||''}</th><th class="r">Plays</th><th class="r">%</th>${opts.noRP?'':'<th><span style="color:#ff8a9a">Run</span> / <span style="color:var(--ice)">Pass</span></th><th class="r" style="color:#ff8a9a">Run%</th><th class="r" style="color:var(--ice)">Pass%</th>'}<th class="r">Avg</th>${opts.noDir?'':'<th>L / M / R %</th>'}${opts.extra?opts.extra.map(e=>`<th>${e[0]}</th>`).join(''):''}<th class="r">Succ%</th></tr></thead><tbody>

function nextPlays(all, pred){ // the play that FOLLOWS a play matching pred, same game + series

  byDrive.forEach(([,v])=>{ for(let i=0;i<v.length-1;i++){ if(pred(v[i])) out.push(Object.assign({},v[i+1],{_prev:v[i]})); } });
  return out;
}
function firstOfSeries(all){ return groupBy(all.slice().sort((a,b)=>a.n-b.n),p=>p.gameId+'|'+p.series).map(([,v])=>v[0]).filter(Boolean); }

const FIRST_SITS=[
  ['1st play of the series', 'the opening call of every drive', all=>firstOfSeries(all)],
  ['After an explosive run', 'the next call after a run of 12+', all=>nextPlays(all,p=>p.d.rp==='RUN'&&(+p.yds||0)>=12)],
  ['After an explosive pass', 'the next call after a completion of 16+', all=>nextPlays(all,p=>p.d.rp==='PASS'&&/^COMPLETE/.test(p.result||'')&&(+p.yds||0)>=16)],

  ['After a 1st-down completion', 'the next call after a completion that moved the chains', all=>nextPlays(all,p=>p.d.rp==='PASS'&&/^COMPLETE/.test(p.result||'')&&gainedFirst(p))],

        <h4>QB by field zone</h4>${qbTable(groupBy(drop,p=>p.d.zone).sort((a,b)=>ZONE_ORDER.indexOf(a[0])-ZONE_ORDER.indexOf(b[0])),'Zone')}

      ${qbHTML}
      ${byP.map(([k,v])=>`<h3>${esc(k)} <span class="note">· ${v.length} touches/targets · ${avg(v.map(p=>+p.yds||0))} avg · ${v.filter(p=>/TD$/.test(p.result)).length} TD</span></h3>
        <div class="form-row"><div><h4>By down</h4>${tendTable(groupBy(v,p=>p.down+' DOWN').sort((a,b)=>a[0].localeCompare(b[0])),{label:'Down',extra:[TOPC,TOPPC]})}</div><div><h4>By field zone</h4>${tendTable(groupBy(v,p=>p.d.zone).sort((a,b)=>ZONE_ORDER.indexOf(a[0])-ZONE_ORDER.indexOf(b[0])),{label:'Zone',extra:[TOPC,TOPPC]})}</div></div>
        <h4>By formation</h4>${tendTable(groupBy(v,p=>p.d.formation),{label:'Formation',extra:SW_EXTRA.concat([TOPC,TOPPC])})}
        <h4>By D&D</h4>${tendTable(groupBy(v,p=>p.d.dd).sort((a,b)=>a[0].localeCompare(b[0])),{label:'D&D',extra:[TOPF,TOPC,TOPPC]})}`).join('')}`;
    }
  }
  return '';
}

function downDrill(ps){
  const o=opp(); const D=downName();
  const label=n=>{ const r=(o.roster||[]).find(x=>x.num===n); return '#'+n+(r?' '+(r.pos||''):''); };
  const tagged=ps.flatMap(p=>p.players.map(n=>({...p,_pl:n})));
  return `<div class="row noprint" style="align-items:center;gap:10px"><span class="focus">${D} FOCUS <button data-act="downPick" data-v="ALL">✕ clear</button></span><span class="note">every tab is filtered to ${D.toLowerCase()}${downFilter.length>1?'s combined':'s'} · tap another down above to add it</span></div>
  <h4>${D} by distance</h4>${tendTable(groupBy(ps,p=>DIST_GROUP(p)).sort((a,b)=>['SHORT','MED','LONG','GOAL'].indexOf(a[0])-['SHORT','MED','LONG','GOAL'].indexOf(b[0])),{label:'Distance',extra:[TOPF,TOPC,TOPPC]})}
  <h4>${D} by field zone</h4>${tendTable(groupBy(ps,p=>p.d.zone).sort((a,b)=>ZONE_ORDER.indexOf(a[0])-ZONE_ORDER.indexOf(b[0])),{label:'Zone',extra:[TOPF,TOPC,TOPPC]})}
  <h4>${D} by formation</h4>${tendTable(groupBy(ps,p=>p.d.formation),{label:'Formation',extra:SW_EXTRA.concat([['Zones',x=>topList(x,p=>p.d.zone)],TOPC,TOPPC])})}
  <h4>${D} by personnel</h4>${tendTable(groupBy(ps,p=>p.pers),{label:'Pers',extra:[TOPF,TOPC,TOPPC]})}
  <h4>${D} attack vector</h4>${tendTable(groupBy(ps,attackKey),{label:'Field/Bdry · Str/Wk',extra:[TOPF,TOPC,TOPPC]})}
  <h4>${D} key players</h4>${tagged.length?tendTable(groupBy(tagged,p=>label(p._pl)),{label:'Player',extra:[['Zones',x=>topList(x,p=>p.d.zone)],TOPF,TOPC,TOPPC]}):'<div class="note">No players tagged.</div>'}
  <h3>${D} — FORMATION USE BY FIELD ZONE</h3>${nested(ps.slice().sort((a,b)=>ZONE_ORDER.indexOf(a.d.zone)-ZONE_ORDER.indexOf(b.d.zone)),p=>p.d.zone,'Zone',p=>p.d.formation,'Formation')}
  <h4>${D} concepts</h4>${tendTable(groupBy(ps,p=>p.concept||null),{label:'Concept',extra:[TOPF,['Zones',x=>topList(x,p=>p.d.zone)]]})}`;

function reportTitle(){ const o=opp(), g=game(); const scopeLabel = repScope==='game'? `${g.label} · ${g.date}` : repScope==='opp'? `all ${S.games.filter(x=>x.oppId===o.id).length} games` : 'all opponents'; return `${o.name} — OFFENSIVE TENDENCIES${downFilter?' — '+downName():''}${rpFilter!=='ALL'?' — '+rpFilter+' ONLY':''} <span style="color:var(--muted);font-size:14px;font-weight:600">${esc(scopeLabel)}</span>`; }
function renderReports(){
  const all=scopePlays().filter(p=>p.d); const o=opp();
  document.getElementById('reports').innerHTML=`
  <div class="panel rep" style="flex:1;min-height:0">
    <div class="ph noprint" style="flex-wrap:wrap;gap:6px"><div class="row">${[['game','GAME'],['opp','ALL vs '+o.name],['all','EVERYTHING']].map(([v,l])=>`<button class="btn ${repScope===v?'on':''}" style="font-size:13px;height:32px;padding:0 10px" data-act="repScope" data-v="${v}">${esc(l)}</button>`).join('')}</div>
      <div class="row">${[['ALL','ALL PLAYS'],['RUN','RUN ONLY'],['PASS','PASS ONLY']].map(([v,l])=>`<button class="btn ${rpFilter===v?'ok on':''}" style="font-size:13px;height:32px;padding:0 10px" data-act="rpFilter" data-v="${v}">${l}</button>`).join('')}<span style="width:6px"></span>${[['ALL','ALL DOWNS'],['1','1ST'],['2','2ND'],['3','3RD'],['4','4TH']].map(([v,l])=>`<button class="btn ${v==='ALL'?(!downFilter?'on':''):(downFilter&&downFilter.includes(+v)?'on':'')}" style="font-size:13px;height:32px;padding:0 10px;${v==='ALL'?'':'min-width:46px'}" data-act="downPick" data-v="${v}">${l}</button>`).join('')}<button class="btn ok on" style="font-size:13px;height:32px;padding:0 10px" data-act="pdf">PDF</button><button class="sm" data-act="print">Print</button></div></div>
    <div class="row noprint" style="gap:4px;border-bottom:1px solid var(--line);padding-bottom:6px">${REP_TABS.map(([k,l])=>`<button class="btn ${repTab===k?'on':''}" style="font-size:14px;height:34px" data-act="repTab" data-v="${k}">${l}</button>`).join('')}<span class="note" style="margin-left:auto;align-self:center;font-family:var(--mono);font-size:11px;letter-spacing:1px">${reportTitle()}</span></div>

let repSub={};
function sectionize(html){
  const tmp=document.createElement('div'); tmp.innerHTML=html;
  const pre=[], secs=[]; let curSec=null, seenH3=false;
  for(const n of [...tmp.childNodes]){
    if(n.nodeType===1 && n.tagName==='H3') seenH3=true;
    const isH = n.nodeType===1 && (n.tagName==='H3'||(n.tagName==='H4'&&!seenH3));
    if(isH){ const t=n.cloneNode(true); t.querySelectorAll('.note').forEach(x=>x.remove()); curSec={title:t.textContent.trim(), nodes:[n]}; secs.push(curSec); }
    else if(curSec) curSec.nodes.push(n);
    else pre.push(n);
  }
  // charts become their own pages (2 per page) so nothing stacks
  const chartsEl=pre.find(n=>n.nodeType===1&&n.classList.contains('charts'));
  if(chartsEl){
    const cs=[...chartsEl.querySelectorAll('.chart')]; pre.splice(pre.indexOf(chartsEl),1);
    const pages=[]; let cur=[]; cs.forEach(c=>{ if(c.classList.contains('wide')){ if(cur.length){pages.push(cur);cur=[];} pages.push([c]); } else { cur.push(c); if(cur.length===2){pages.push(cur);cur=[];} } }); if(cur.length) pages.push(cur);
    pages.reverse().forEach((pg,i)=>{ const wrap=document.createElement('div'); wrap.className='charts'; pg.forEach(c=>wrap.appendChild(c)); const n=pages.length; secs.unshift({title: n>1?`CHARTS ${n-i}/${n}`:'CHARTS', nodes:[wrap]}); });
  }
  ['Keys','Dashboard'].forEach(t=>{ const ki=secs.findIndex(sc=>sc.title===t); if(ki>0){ const [k]=secs.splice(ki,1); secs.unshift(k); } });
  if(secs.length<2){ return html; }
  // remember the sub-tab per report TAB by its title, so changing scope / run-pass / down filters keeps you on the same page
  const key=repTab; const wantTitle=repSub[key];
  let idx=secs.findIndex(sc=>sc.title===wantTitle); if(idx<0) idx=0;
  const out=document.createElement('div');
  pre.forEach(n=>out.appendChild(n));
  const bar=document.createElement('div'); bar.className='row noprint subtabs';
  bar.innerHTML=secs.map((sc,i)=>`<button class="btn ${i===idx?'on':''}" data-act="repSub" data-k="${esc(key)}" data-t="${esc(sc.title)}">${esc(sc.title)}</button>`).join('');
  out.appendChild(bar);
  const body=document.createElement('div'); body.className='subbody';
  secs[idx].nodes.forEach(n=>body.appendChild(n));
  out.appendChild(body);
  return out.innerHTML;
}

function parseCSV(text){

    else if(c==='"') q=true; else if(c===','){ row.push(cell); cell=''; } else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; } else cell+=c; }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }

}
function normHeader(h){ return String(h||'').trim().toUpperCase().replace(/\s+/g,' '); }

  else if(/SCRAM/.test(v)) r='SCRAMBLE'; else if(/FUM/.test(v)) r=(type==='RUN'||(type==='RPO'&&!/COMP|CATCH/.test(v)))?'FUMBLE':'COMPLETE FUMBLE';

function mapYL(v, sideV){ // returns {side, yl}
  const t=U(v); let side=null, yl=null;

  (inc.games||[]).forEach(g=>{ const ex=S.games.find(x=>x.id===g.id); if(ex) Object.assign(ex,g); else S.games.push(g); });

    else if(n.tagName==='H4'){ doc.heading(n.textContent,9.5,6); }
    else if(n.classList.contains('kpis')){ doc.kpis([...n.querySelectorAll('.kpi')].map(k=>[k.querySelector('b').textContent,k.querySelector('span').textContent])); }
    else if(n.tagName==='TABLE'){ const rows=[...n.querySelectorAll('tr')].map(tr=>[...tr.children].filter(c=>!c.classList.contains('noprint')).map(c=>{ const bars=c.querySelectorAll('.bar'); bars.forEach(b=>b.remove()); return c.textContent; })); doc.table(rows); }
    else if(n.classList.contains('note')){ doc.need(12); doc.y-=10; doc.text(PDF_M,doc.y,n.textContent,8,false,[0.4,0.4,0.4]); }
    else walk(n);
  } };
  walk(container); return doc.bytes();
}
function savePDF(){
  const o=opp(), g=game();
  if(view==='reports'){ const c=document.createElement('div'); c.innerHTML=fullReportHTML(); const scope=repScope==='game'?slug(g.label):repScope==='opp'?'all_games':'everything'; downloadBytes(pdfFromDOM(c,`${o.name} offensive tendencies`),`${slug(o.name)}_tendencies_${scope}${downFilter?'_'+downFilter.join('')+'down':''}${rpFilter!=='ALL'?'_'+rpFilter.toLowerCase():''}.pdf`); }
  else if(view==='log'){ const c=document.getElementById('logTable'); const d=new PDFDoc(`${o.name} play log`); d.heading(`${o.name} — PLAY LOG — ${g.label} · ${g.date}`,13,10); const rows=[...c.querySelectorAll('tr')].map(tr=>[...tr.children].filter(x=>!x.classList.contains('noprint')).map(x=>x.textContent)); d.table(rows); downloadBytes(d.bytes(),`${slug(o.name)}_${slug(g.label)}_play_log.pdf`); }
}


/* ---------- sample data generator (demo opponent with built-in tendencies) ---------- */
function loadSample(){
  let seed=20261016; const rnd=()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  const pick=(arr,w)=>{ const tot=w.reduce((a,b)=>a+b,0); let x=rnd()*tot; for(let i=0;i<arr.length;i++){ x-=w[i]; if(x<=0) return arr[i]; } return arr[arr.length-1]; };
  const o={id:uid(),name:'SAMPLE OPPONENT',us:'US',personnel:['10','11','12','21'],backfield:['GUN RT','GUN LF','PISTOL','PISTOL RT','PISTOL LF','EMPTY','I','SPLIT GUN'],form:['DOUBLES','TRIPS','TREY','BUNCH','TIGHT','NUB'],motion:['NONE','JET','ORBIT','SHIFT'],
    roster:[{num:'13',pos:'QB',name:''},{num:'6',pos:'RB',name:''},{num:'22',pos:'RB',name:''},{num:'1',pos:'WR',name:''},{num:'7',pos:'WR',name:''},{num:'84',pos:'TE',name:''}]};
  ['backfield','form','motion','personnel'].forEach(c=>o[c].forEach(v=>{ if(!S.lib[c].includes(v)) S.lib[c].push(v); }));
  S.opponents.push(o); const g=newGame(o.id,'Sample Game'); g.label='Sample Game'; S.games.push(g); g.score={opp:24,us:27}; g.to={opp:[1,2],us:[2,3]};
  let e=Object.assign(blankEntry(),{down:1,dist:10,side:'OWN',yl:25}); let n=0, series=1;
  const RUNC=['IZ','OZ','Counter','Power','Duo','Jet Swp','QB Draw'], PASSC=['Mesh','Y-Cross','Smash','Verts','Bubble','Stick','Flood','Slant-Flat','Screen'];
  while(n<65){
    const tg=toGoal(e.side,e.yl); const rz=tg<=20; const dd=ddBucket(e);
    e.hash=pick(['L','M','R'],[4,2,4]);
    // personnel + formation tendencies by situation
    e.pers = rz? pick(['11','12','21'],[4,4,2]) : dd.endsWith('LONG')||dd.endsWith('XLONG')? pick(['10','11'],[4,6]) : pick(['11','12','10','21'],[6,2,2,1]);
    e.bf = e.pers==='10'? pick(['GUN RT','GUN LF','EMPTY'],[3,3,4]) : e.pers==='21'||e.pers==='12'? pick(['PISTOL','I','PISTOL RT','PISTOL LF','SPLIT GUN'],[3,3,2,2,1]) : pick(['GUN RT','GUN LF','PISTOL','EMPTY'],[5,4,2,1]);
    e.form = e.bf==='EMPTY'? pick(['TREY','TRIPS','DOUBLES'],[4,3,2]) : e.pers==='12'||e.pers==='21'? pick(['TIGHT','NUB','BUNCH','DOUBLES'],[4,3,2,1]) : pick(['TRIPS','DOUBLES','BUNCH','TREY'],[5,4,2,1]);
    e.str = /TRIPS|TREY|BUNCH|NUB/.test(e.form)? pick(['RIGHT','LEFT'],[6,4]) : pick(['BALANCED','RIGHT','LEFT'],[5,2,2]);
    e.motion = pick(['NONE','JET','ORBIT','SHIFT'],[7,2,1,1]);
    // run/pass: heavy run early downs out of pistol/under & 12/21, pass from empty/10, 3rd & long pass
    let pRun = 0.5; if(/PISTOL|UNDER/.test(e.bf)) pRun+=0.25; if(e.bf==='EMPTY') pRun-=0.4; if(e.pers==='12'||e.pers==='21') pRun+=0.15; if(e.pers==='10') pRun-=0.15;
    if(e.down===1) pRun+=0.1; if(dd.endsWith('SHORT')) pRun+=0.25; if(dd.endsWith('LONG')||dd.endsWith('XLONG')) pRun-=0.3; if(rz) pRun+=0.1; if(e.motion==='JET') pRun+=0.15;
    const isRun = rnd()<Math.max(0.08,Math.min(0.92,pRun));
    e.type = isRun? (rnd()<0.2?'RPO':'RUN') : (rnd()<0.12?'SCREEN':rnd()<0.15?'RPO':'PASS');
    // direction: run to strength 65%, to the back 60%; pass more balanced
    const strongDir = e.str==='RIGHT'?'RIGHT':e.str==='LEFT'?'LEFT':null;
    if(isRun){ e.dir = rnd()<0.3?'MIDDLE': (strongDir&&rnd()<0.65? strongDir : pick(['LEFT','RIGHT'],[1,1])); }
    else { e.dir = pick(['LEFT','MIDDLE','RIGHT'],[3,3,4]); }
    if(e.hash==='L'&&!isRun&&rnd()<0.6) e.dir='RIGHT'; if(e.hash==='R'&&!isRun&&rnd()<0.6) e.dir='LEFT'; // pass to the field
    // players & concept
    if(isRun){ e.players=[pick(['6','22','13'],[6,3,1])]; e.concept=pick(RUNC,[5,3,2,2,2,e.motion==='JET'?6:0.5,1]); }
    else { e.players=[pick(['1','7','84','6'],[5,3,3,1])]; e.concept=pick(PASSC,[3,3,3,2,2,2,2,2,e.type==='SCREEN'?8:0.3]); }
    // yards + result
    let yds, result;
    if(isRun){ yds=Math.round(Math.max(-3, (rnd()+rnd()+rnd())*6-3 + (rnd()<0.08?15:0))); result = tg-yds<=0?'RUSH TD': rnd()<0.03?'FUMBLE':'RUSH'; if(result==='RUSH TD') yds=tg; }
    else { const r=rnd(); if(r<0.36){ result='INCOMPLETE'; yds=0; } else if(r<0.42){ result='SACK'; yds=-Math.round(4+rnd()*6); } else if(r<0.45){ result='INTERCEPTION'; yds=0; } else if(r<0.5){ result='SCRAMBLE'; yds=Math.round(rnd()*9); } else { result='COMPLETE'; yds=Math.round(3+rnd()*rnd()*28); if(tg-yds<=0){ result='COMPLETE TD'; yds=tg; } } }
    e.yds=yds; e.result=result; e.fumRec=false;
    const rec=Object.assign({},e,{players:[...e.players]}); rec.d=derive(rec); rec.id=uid(); rec.gameId=g.id; rec.oppId=o.id; rec.n=++n; rec.snip=n; rec.series=series; rec.qtr=Math.min(4,1+Math.floor((n-1)/17)); rec.ts=Date.now()-(65-n)*60000; S.plays.push(rec);
    const nx=computeNext(e);
    if(nx.newDrive){ series++; e=Object.assign(blankEntry(),{down:1,dist:10,side:'OWN',yl:Math.round(18+rnd()*22)}); }
    else e=Object.assign(blankEntry(),{down:nx.down,dist:nx.dist,side:nx.side,yl:nx.yl});
  }
  g.series=series; g.qtr=4; g.sit={hash:null,down:e.down,dist:e.dist,side:e.side,yl:e.yl};
  S.ui.oppId=o.id; S.ui.gameId=g.id; loadSit(); save(); toast('Sample opponent loaded — 65 plays'); view='reports'; repTab='overview'; render();
}

window.addEventListener('beforeunload',()=>save());
loadSit();
render();
